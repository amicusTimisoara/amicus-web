name: Deploy to Cloudflare Pages

on:
  # Merge to main -> STAGING (staging.amicus-web.pages.dev, talks to the stage API).
  push:
    branches: [main]
  # A published Release -> PRODUCTION (app.thorsp.net, talks to the prod API).
  release:
    types: [published]
  # PRs get their own preview URL, also pointed at the stage API.
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment to deploy
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Decide the target once. Release (or a manual production run) is the only
      # thing that touches prod; everything else is staging/preview on the stage API.
      - name: Resolve target
        id: t
        run: |
          if [ "${{ github.event_name }}" = "release" ] || [ "${{ inputs.environment }}" = "production" ]; then
            echo "branch=production"        >> "$GITHUB_OUTPUT"
            echo "api=https://api.thorsp.net" >> "$GITHUB_OUTPUT"
            echo "google=695044425932-id1oe3r50825d02o4pjrijeuj3fc6qma.apps.googleusercontent.com" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "branch=${{ github.head_ref }}" >> "$GITHUB_OUTPUT"
            echo "api=https://stage.thorsp.net"  >> "$GITHUB_OUTPUT"
            echo "google=" >> "$GITHUB_OUTPUT"
          else
            echo "branch=staging"                >> "$GITHUB_OUTPUT"
            echo "api=https://stage.thorsp.net"   >> "$GITHUB_OUTPUT"
            echo "google=695044425932-id1oe3r50825d02o4pjrijeuj3fc6qma.apps.googleusercontent.com" >> "$GITHUB_OUTPUT"
          fi

      # app.thorsp.net (prod) and staging.amicus-web.pages.dev (staging) are
      # allow-listed on the OAuth client, so both ship the Google button. PR
      # previews get a unique *.amicus-web.pages.dev origin that Google can't
      # wildcard, so they stay password-only.
      - name: Build
        run: bun run build
        env:
          VITE_API_BASE: ${{ steps.t.outputs.api }}
          VITE_GOOGLE_CLIENT_ID: ${{ steps.t.outputs.google }}

      - name: Deploy to Cloudflare Pages
        id: cf
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=amicus-web --branch=${{ steps.t.outputs.branch }}

      # On PRs, drop (or update) a sticky comment with the preview URL — the
      # thing Cloudflare's Git integration would post. We deploy by direct
      # upload, so we post it ourselves.
      - name: Comment preview URL on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            // Cloudflare's own Git integration posts a comment with a branch link
            // (always latest) and a per-deployment link (this exact commit). We
            // deploy by direct upload, so reproduce both from wrangler's outputs.
            const branchUrl = ${{ toJSON(steps.cf.outputs.pages-deployment-alias-url) }};
            const commitUrl = ${{ toJSON(steps.cf.outputs.deployment-url) }};
            // On a PR, context.sha is the synthetic merge commit; show the real head sha.
            const sha = (context.payload.pull_request?.head?.sha || context.sha).slice(0, 7);
            const marker = '<!-- amicus-preview -->';
            const rows = [];
            if (branchUrl) rows.push(`| **Branch preview** (always latest) | ${branchUrl} |`);
            if (commitUrl && commitUrl !== branchUrl) rows.push(`| **This commit** (\`${sha}\`) | ${commitUrl} |`);
            const links = rows.length
              ? `\n\n| | |\n|---|---|\n${rows.join('\n')}`
              : `\n\n${branchUrl || commitUrl || '_(deployment URL unavailable)_'}`;
            const body = `${marker}\n### ⚡ Preview deployed${links}\n\nUpdates on every push · points at the staging API.`;
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const {data: comments} = await github.rest.issues.listComments({owner, repo, issue_number});
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body});
            }
