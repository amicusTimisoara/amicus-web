name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # main build talks to the prod API; a PR preview talks to stage, so a
      # preview can never mutate production data.
      - name: Build
        run: bun run build
        env:
          VITE_API_BASE: ${{ github.ref == 'refs/heads/main' && 'https://api.thorsp.net' || 'https://stage.thorsp.net' }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # A push to main becomes a production deploy; a PR builds a preview URL
          # on its own branch. wrangler prints the preview URL in the job log.
          command: >-
            pages deploy dist
            --project-name=amicus-web
            --branch=${{ github.head_ref || github.ref_name }}
